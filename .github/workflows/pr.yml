name: pr-security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-3
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.13.4"
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_VERSION: "1.178.0"
  TRIVY_VERSION: "0.74.0"
  CHECKOV_VERSION: "3.3.20"
  OPA_VERSION: "1.21.0"
  CONFTEST_VERSION: "0.70.1"

jobs:
  scans:
    name: Scans de sécurité (sans accès AWS)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code (historique complet pour Gitleaks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: "1. Gitleaks : secrets dans tout l'historique"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact -v

      - name: "2. Semgrep : analyse statique du code Python"
        if: ${{ !cancelled() }}
        run: |
          pip install "semgrep==${SEMGREP_VERSION}"
          semgrep scan --config p/python --config p/security-audit --error --metrics=off app/

      - name: "3. Trivy : CVE HIGH/CRITICAL dans les dépendances"
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfLO "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "trivy_${TRIVY_VERSION}_checksums.txt"
          tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          ./trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 app/

      - name: "4. pytest : tests unitaires"
        if: ${{ !cancelled() }}
        run: |
          pip install -r app/requirements.txt -r app/requirements-dev.txt
          python -m pytest app/tests -q

      - name: "5. Checkov : conformité de l'IaC"
        if: ${{ !cancelled() }}
        run: |
          pip install "checkov==${CHECKOV_VERSION}"
          checkov -d infra --compact --quiet

  plan:
    name: Plan Terraform + politiques OPA
    needs: scans
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Construire le paquet Lambda
        run: bash scripts/build_lambda.sh

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Installer OPA et Conftest
        run: |
          set -euo pipefail
          curl -sSfLo opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          curl -sSfLo opa.sha256 "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static.sha256"
          echo "$(cut -d' ' -f1 opa.sha256)  opa" | sha256sum --check
          base="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -sSfLO "$base/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfLO "$base/checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
          chmod +x opa conftest
          sudo mv opa conftest /usr/local/bin/

      - name: "6. Tests des règles OPA"
        run: opa test policies/ -v

      - name: Authentification AWS par OIDC (rôle plan, lecture seule)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: Terraform init et plan
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json

      - name: "7. Conftest : tes politiques sur le plan réel"
        working-directory: infra
        run: conftest test plan.json --policy ../policies --all-namespaces

      - name: "8. Résumé du plan en commentaire de la PR"
        if: always()
        working-directory: infra
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          [ -f tfplan ] || exit 0
          {
            echo "### Plan Terraform"
            echo '```'
            terraform show -no-color tfplan | grep -E '^  # |^Plan:|^No changes' || true
            echo '```'
          } > summary.md
          gh pr comment "$PR" --body-file summary.md --repo "$GITHUB_REPOSITORY"
